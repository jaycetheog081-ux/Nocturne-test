name: Nocturne

options:
  bundleIdPrefix: com.nocturne
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: Nocturne
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - path: Nocturne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocturne.app
        PRODUCT_NAME: Nocturne
        SWIFT_EMIT_LOC_STRINGS: "YES"
